<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Binary Signal Bot</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #181818;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      width: 320px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .broker-title {
      font-size: 14px;
      color: #007aff;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }
    .pair-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
    .timeframe { color: #aaa; font-size: 14px; margin-bottom: 20px; }
    .signal-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid #8e8e93;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 50px;
      color: #8e8e93;
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }
    .btn-action {
      background-color: #3a3a3c;
      color: white;
      padding: 12px 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 20px;
      letter-spacing: 1px;
      border: none;
      width: 100%;
    }
    .stats-container { display: flex; justify-content: space-between; gap: 10px; }
    .stat-box {
      background: #242424;
      padding: 10px;
      border-radius: 8px;
      flex: 1;
    }
    .stat-label { font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
    .stat-value { font-size: 15px; font-weight: bold; color: #4cd964; }
  </style>
</head>
<body>

  <div class="card">
    <div class="broker-title">Live Market Bot</div>
    <div class="pair-title">EUR/USDT (Live Market)</div>
    <div class="timeframe">Timeframe: 1 Minute</div>

    <div class="signal-circle" id="signalIcon">⌛</div>
    <div class="btn-action" id="signalBtn">ANALYZING MARKET...</div>

    <div class="stats-container">
      <div class="stat-box">
        <div class="stat-label">RSI Value</div>
        <div class="stat-value" id="rsiVal" style="color: #ff9500;">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Market Status</div>
        <div class="stat-value" id="marketStatus">Connecting</div>
      </div>
    </div>
  </div>

  <script>
    async function fetchLiveMarketData() {
      try {
        const res = await fetch('https://api.binance.com/api/v3/klines?symbol=EURUSDT&interval=1m&limit=20');
        const data = await res.json();
        
        const closes = data.map(candle => parseFloat(candle[4]));
        const currentPrice = closes[closes.length - 1];

        // RSI Calculation (14 Period)
        let gains = 0, losses = 0;
        for (let i = closes.length - 14; i < closes.length; i++) {
          const diff = closes[i] - closes[i - 1];
          if (diff >= 0) gains += diff;
          else losses -= diff;
        }
        const avgGain = gains / 14;
        const avgLoss = losses / 14;
        const rs = avgGain / (avgLoss || 1);
        const rsi = Math.round(100 - (100 / (1 + rs)));

        document.getElementById('rsiVal').innerText = rsi;
        document.getElementById('marketStatus').innerText = 'Active';

        const icon = document.getElementById('signalIcon');
        const btn = document.getElementById('signalBtn');

        // Signal Logic Based on Real RSI Indicator
        if (rsi <= 30) {
          icon.innerText = '↗';
          icon.style.borderColor = '#34c759';
          icon.style.color = '#34c759';
          icon.style.background = 'rgba(52, 199, 89, 0.1)';
          btn.innerText = 'CALL (BUY SIGNAL)';
          btn.style.backgroundColor = '#34c759';
        } else if (rsi >= 70) {
          icon.innerText = '↘';
          icon.style.borderColor = '#ff3b30';
          icon.style.color = '#ff3b30';
          icon.style.background = 'rgba(255, 59, 48, 0.1)';
          btn.innerText = 'PUT (SELL SIGNAL)';
          btn.style.backgroundColor = '#ff3b30';
        } else {
          icon.innerText = '⌛';
          icon.style.borderColor = '#8e8e93';
          icon.style.color = '#8e8e93';
          icon.style.background = 'rgba(255, 255, 255, 0.05)';
          btn.innerText = 'WAIT FOR SETUP';
          btn.style.backgroundColor = '#3a3a3c';
        }

      } catch (err) {
        document.getElementById('marketStatus').innerText = 'Error';
      }
    }

    // Auto update every 5 seconds
    fetchLiveMarketData();
    setInterval(fetchLiveMarketData, 5000);
  </script>

</body>
</html>
